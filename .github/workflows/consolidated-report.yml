
name: Consolidated Project Progress Report

on:
  schedule:
    # Thursday, 12:05 AM IST (18:35 UTC Wednesday)
    - cron: '35 18 * * 3'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-consolidated-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository with Full Git History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install reportlab matplotlib

      - name: Generate Consolidated Report
        run: |
          python generate_consolidated_report.py

      - name: Commit Consolidated Report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add consolidated_reports/Complete_Project_Progress_Report.pdf

          if git diff --staged --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "docs: update consolidated project progress report [skip ci]"
            git push
          fi
