
name: Complete Project Progress Report

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-final-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository with Full Git History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install reportlab matplotlib

      - name: Generate Complete Report
        run: |
          python generate_report.py final

      - name: Archive and Commit Report
        run: |
          mkdir -p final_reports
          mv *_Final_Report_*.pdf final_reports/

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add final_reports/

          if git diff --staged --quiet; then
            echo "No new report to commit."
          else
            git commit -m "docs: add complete project progress report [skip ci]"
            git push
          fi
